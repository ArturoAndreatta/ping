name: Release do programa do PC

# tag v1.2.3: monta o instalador .exe, o zip de atualizacao e o versao.json assinado, testa o instalador num
# Windows de verdade e publica tudo no release (de onde a atualizacao sozinha baixa)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao pra testar (sem publicar), ex.: 0.0.1"
        required: true

# actions presas pelo commit (tag pode ser movida)
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # versao.json assinado com a chave do projeto (assinatura.py): sem o secret o passo falha
      - name: Monta o instalador e a atualizacao
        working-directory: pc
        env:
          PING_ASSINATURA: ${{ secrets.PING_ASSINATURA }}
          VERSAO: ${{ github.event.inputs.versao || github.ref_name }}
        run: python empacotar.py $env:VERSAO

      - name: .exe tem o icone do Ping e nao pede administrador
        working-directory: pc
        run: python -c "import empacotar, glob; r = empacotar.recursos(glob.glob('dist/Ping-*.exe')[0]); m = b''.join(b for _, _, b in r[24]); assert len(r[14]) == 1 and len(r[3]) == 9 and b'requireAdministrator' not in m; print('ok')"

      - name: Abre o .exe como quem baixou faria
        shell: pwsh
        run: |
          $exe = (Get-Item "pc\dist\Ping-*.exe").FullName
          Write-Host "$exe  $([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(300000)) { Write-Host "instalador travou"; exit 1 }
          Get-ChildItem "$env:LOCALAPPDATA\Ping" | Select-Object Name
          if (-not (Test-Path "$env:LOCALAPPDATA\Ping\python\pythonw.exe")) { exit 1 }

      - name: Instalador criou o atalho e o Ping ficou rodando
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $desk = [Environment]::GetFolderPath('Desktop')
          $proc = Get-CimInstance Win32_Process -Filter "Name='pythonw.exe'" | Where-Object { $_.CommandLine -like '*ping.pyw*' }
          Write-Host "atalho: $(Test-Path "$desk\Ping.lnk")  rodando: $([bool]$proc)"
          if (Test-Path "$env:LOCALAPPDATA\Ping\ping.log") { Get-Content "$env:LOCALAPPDATA\Ping\ping.log" -Tail 20 }
          if (-not $proc -or -not (Test-Path "$desk\Ping.lnk")) { exit 1 }
          $proc | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }

      - name: Python da pasta importa tudo (sem Python do sistema no PATH)
        shell: pwsh
        run: |
          $k = "$env:LOCALAPPDATA\Ping"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          Push-Location $k
          & "$k\python\python.exe" -c "import sys; print(sys.version); import requests, psutil, pystray, PIL; import lcu, ponte, painel, hoje, avisos, atualizar; print('imports ok, versao', atualizar.versao_local())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location

      - name: versao.json assinado confere
        working-directory: pc
        run: python -c "import json, assinatura, atualizar; i = json.load(open('dist/versao.json')); assert assinatura.info_valida(i) and i['deps'] == atualizar.hash_deps(); print(i['versao'], i['arquivo'])"

      - name: Publica no release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME --title "Ping $env:GITHUB_REF_NAME" --generate-notes `
            (Get-Item "pc\dist\Ping-*.exe").FullName (Get-Item "pc\dist\ping-*.zip").FullName "pc\dist\versao.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: Ping
          path: |
            pc/dist/Ping-*.exe
            pc/dist/ping-*.zip
            pc/dist/versao.json
